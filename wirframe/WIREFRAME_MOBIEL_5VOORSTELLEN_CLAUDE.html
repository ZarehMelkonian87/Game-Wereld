<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>5 voorstellen — Mobiele Telefoon (T-42)</title>
<style>
  :root{--bg:#0b1220;--panel:#131c2e;--line:#25324d;--ink:#e8eefc;--muted:#94a3c4;
    --accent:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line)}
  h1{font-size:18px;margin:0;font-weight:800}
  .sub{color:var(--muted);font-size:12.5px;margin-top:4px;max-width:900px}
  .bar{padding:12px 22px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:9px 14px;
    border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
  .tab b{display:block;color:var(--ink);font-size:13px}
  .tab[aria-selected="true"]{background:#0c4a6e;border-color:#0369a1}
  .tab[aria-selected="true"] b{color:#e0f2fe}
  .wrap{padding:20px 22px 40px}
  .strategy{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:14px;padding:16px 18px;margin-bottom:18px;max-width:1040px}
  .strategy h2{margin:0 0 6px;font-size:16px}
  .strategy p{margin:6px 0 0;color:#c6d2ea;font-size:13.5px}
  .gainrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .gain{background:#0f1b30;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
    font-size:12px;color:var(--muted)}
  .gain b{color:var(--ok);font-size:15px;display:block}
  .gain.read b{color:var(--warn)}
  .phones{display:flex;gap:16px;flex-wrap:wrap}
  .col{width:236px}
  .cap{font-size:12.5px;font-weight:800;margin-bottom:6px;color:#cbd5e1}
  .cap span{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
  .frame{width:228px;height:494px;overflow:hidden}
  .scaler{width:393px;height:852px;transform:scale(.58);transform-origin:top left}
  .phone{width:393px;height:852px;border-radius:52px;background:#000;padding:12px}
  .screen{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;
    display:flex;flex-direction:column;color:#0f172a;
    background:linear-gradient(180deg,#bae6fd 0%,#7dd3fc 45%,#fde9c4 100%)}
  .island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:28px;
    background:#000;border-radius:999px;z-index:30}
  .stack{position:absolute;inset:0;display:flex;flex-direction:column;
    padding:52px 16px 28px;gap:8px;z-index:10}
  .spacer{flex:1;min-height:0}
  /* chrome */
  .top{display:flex;align-items:center;gap:8px;flex:none;min-height:44px}
  .rnd{width:44px;height:44px;border-radius:999px;background:#fff;display:grid;place-items:center;
    font-size:17px;box-shadow:0 2px 0 rgba(15,23,42,.14);flex:none}
  .chip{background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;
    box-shadow:0 2px 0 rgba(15,23,42,.14)}
  .plate{background:#fff;border-radius:16px;box-shadow:0 3px 0 rgba(15,23,42,.12);flex:none}
  .instr{padding:10px 12px;text-align:center;font-weight:800;line-height:1.3}
  .kw{color:#0369a1;background:#e0f2fe;border-radius:7px;padding:0 5px}
  .kw.w{color:#b45309;background:#fef3c7}
  .rowc{display:flex;align-items:center;gap:8px}
  .vid{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;
    font-size:22px;background:linear-gradient(160deg,#7dd3fc,#fde9c4);box-shadow:0 2px 0 rgba(15,23,42,.2)}
  .vid.sm{width:42px;height:42px;font-size:18px;border-radius:12px}
  .mic{border-radius:14px;background:linear-gradient(180deg,#38bdf8,#0284c7);color:#fff;
    font-weight:900;display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:0 3px 0 #075985}
  .wv{display:flex;gap:3px;align-items:center;margin-left:auto}
  .wv i{width:4px;border-radius:2px;background:rgba(255,255,255,.9);display:block}
  .tray{display:flex;gap:9px;flex:none;align-items:center}
  .st{width:56px;height:56px;border-radius:15px;background:#fff;display:grid;place-items:center;
    font-size:26px;box-shadow:0 3px 0 rgba(15,23,42,.14);flex:none}
  .st.slim{width:40px;height:40px;font-size:19px;border-radius:12px}
  .prog{height:10px;border-radius:999px;background:rgba(255,255,255,.75);overflow:hidden;flex:none}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#34d399)}
  .statusbar{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px}
  .cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .cd{background:#fff;border-radius:18px;display:grid;place-items:center;font-size:44px;
    box-shadow:0 3px 0 rgba(15,23,42,.12)}
  .zone{position:absolute;border:2px dashed rgba(2,132,199,.8);border-radius:14px;
    background:rgba(224,242,254,.45);font-size:13px;font-weight:900;color:#075985;
    display:grid;place-items:center}
  .toast{position:absolute;left:16px;right:16px;bottom:150px;background:#ecfdf5;
    border:2px solid #6ee7b7;border-radius:14px;padding:8px 12px;font-size:12.5px;
    font-weight:800;color:#065f46;z-index:20}
  .rail{position:absolute;right:10px;top:90px;bottom:90px;width:60px;border-radius:22px;
    background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(15,23,42,.14);z-index:20;
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
  .rail .r{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;font-size:16px;
    background:#f1f5f9;font-weight:900}
  .thumbrail{position:absolute;right:12px;top:120px;bottom:120px;width:44px;border-radius:999px;
    background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9);z-index:20;
    display:flex;align-items:center;justify-content:center;font-size:13px;writing-mode:vertical-rl}
  .hud{position:absolute;left:16px;right:16px;top:56px;display:flex;gap:6px;z-index:20}
  .fly{position:absolute;left:50%;transform:translateX(-50%);font-size:34px}
  .obj{position:absolute;font-size:28px}
  .float{position:absolute;z-index:20}
  /* checklist */
  .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;
    margin-top:18px;max-width:1040px}
  .ck{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .ck h4{margin:0 0 8px;font-size:12.5px;color:#cbd5e1}
  .ck ul{margin:0;padding-left:16px;font-size:12px;color:#a7f3d0;line-height:1.8}
  .ck li span{color:var(--muted)}
  .pane{display:none}.pane.on{display:block}
</style>
</head>
<body>

<header>
  <h1>📱 Vijf ontwerpvoorstellen — mobiele telefoon</h1>
  <div class="sub">T-42 · Elk voorstel is een <b>strategie</b>, toegepast op alle drie de modi.
  Spelwijze en functionaliteit blijven volledig intact — het doel is <b>meer ruimte</b> en
  <b>betere leesbaarheid</b>. Huidige situatie ter vergelijking: instructie 14 px, vrij speelveld ≈ 71%.</div>
</header>

<div class="bar" id="tabs"></div>
<div class="wrap" id="panes"></div>

<script>
/* ---------- gedeelde bouwstenen ---------- */
const ICON = {back:"←", hint:"💡", star:"⭐ 14", video:"🎬", mic:"🎤"};

const wave = (n=4)=>`<span class="wv">${
  [8,18,24,13,20,10].slice(0,n).map(h=>`<i style="height:${h}px"></i>`).join("")}</span>`;

/* Elke modus krijgt slots; een voorstel bepaalt hoe die slots eruitzien. */
function renderKies(p){
  const instrSize = p.readPx;
  return `
  <div class="stack" style="${p.stackStyle||""}">
    ${p.railChrome ? "" : `<div class="top"><div class="rnd">${ICON.back}</div>
      <div class="chip">${ICON.star}</div><div class="spacer"></div>
      <div class="rnd">${ICON.hint}</div></div>`}
    ${p.kiesHead(instrSize)}
    <div class="cards">
      <div class="cd">🦀</div><div class="cd">🐚</div><div class="cd">⛵</div><div class="cd">🌞</div>
    </div>
    ${p.kiesFoot()}
  </div>
  ${p.railChrome ? rail(["←","💡","⭐","4/12"]) : ""}`;
}
function renderZet(p){
  return `
  <div class="stack" style="${p.stackStyle||""}">
    ${p.railChrome ? "" : `<div class="top"><div class="rnd">${ICON.back}</div>
      <div class="chip">${ICON.star}</div><div class="spacer"></div>
      <div class="rnd">${ICON.hint}</div></div>`}
    ${p.zetHead(p.readPx)}
    <div class="spacer"></div>
    ${p.zetTray()}
    ${p.zetMic()}
  </div>
  <div class="zone" style="left:6%;top:34%;width:56%;height:22%">de zee</div>
  <div class="obj" style="left:72%;top:52%">⛱️</div>
  <div class="obj" style="left:16%;top:62%;font-size:24px">🐚</div>
  ${p.showToast?`<div class="toast">✓ Goed! Zeg na: <b>de boot</b> · +1 ⭐</div>`:""}
  ${p.railChrome ? rail(["←","💡","⭐","🎬"]) : ""}`;
}
function renderVlieg(p){
  return `
  <div class="stack" style="${p.stackStyle||""}">
    <div class="spacer"></div>
    ${p.vliegStatus(p.readPx)}
  </div>
  <div class="hud"><div class="chip">🛡️🛡️🛡️</div><div class="chip">281 m</div>
    <div class="spacer"></div><div class="chip">🔥3</div></div>
  <div class="fly" style="top:16%">🦅</div>
  <div class="obj" style="left:18%;top:40%">🏐</div>
  <div class="obj" style="left:66%;top:56%">🐚</div>
  <div class="obj" style="left:38%;top:70%">⛵</div>
  <div class="thumbrail">rail</div>`;
}
const rail = (items)=>`<div class="rail">${items.map(i=>`<div class="r">${i}</div>`).join("")}</div>`;

/* ---------- de vijf voorstellen ---------- */
const P = [
{
  key:"v1", name:"Samenvoegen", tag:"Minder panelen, zelfde functies",
  headline:"Eén doorlopend paneel in plaats van losse kaartjes",
  body:`Elk paneel kost nu een eigen rand, schaduw en binnenmarge. Door de vraagbalk, de
  video-knop en de mic-bediening op <b>één doorlopende plaat</b> te zetten — en de voortgangsbalk
  als dunne lijn ín de bovenbalk op te nemen — verdwijnt er ±70 px aan "verpakking" zonder dat er
  één functie sneuvelt. Die winst gaat rechtstreeks naar grotere letters.`,
  gains:[["+70 px","ruimte terug"],["18 px","instructie",1]],
  readPx:18, showToast:false,
  kiesHead:(s)=>`<div class="plate">
    <div class="rowc" style="padding:8px 10px"><div class="vid">🎬</div>
      <div class="instr" style="flex:1;font-size:${s}px;padding:0">Welke is de <span class="kw">krab</span>?</div></div>
    <div class="prog" style="margin:0 10px 8px"><i style="width:33%"></i></div></div>`,
  kiesFoot:()=>`<div class="plate rowc" style="padding:8px 10px;gap:8px">
    <div style="font-size:12px;font-weight:800;flex:1">Zeg na: <b>de krab</b></div>
    <div class="chip" style="background:#34d399;color:#053527">Volgende →</div></div>`,
  zetHead:(s)=>`<div class="plate">
    <div class="rowc" style="padding:8px 10px"><div class="vid">🎬</div>
      <div class="instr" style="flex:1;font-size:${s}px;padding:0">Zet de <span class="kw">boot</span> in de <span class="kw w">zee</span></div></div>
    <div class="mic" style="height:44px;margin:0 10px 8px">🎤 Zeg het${wave(4)}</div></div>`,
  zetTray:()=>`<div class="tray"><div class="st">⛵</div><div class="st">🏐</div><div class="st">🦀</div><div class="st">🌞</div></div>`,
  zetMic:()=>``,
  vliegStatus:(s)=>`<div class="plate instr" style="font-size:${s}px">Noem wat je ziet</div>
    <div class="mic" style="height:48px">🎤 luistert${wave(5)}</div>`
},
{
  key:"v2", name:"Contextueel", tag:"Alles aanwezig, niet alles tegelijk groot",
  headline:"De instructie is groot om te lézen, klein tijdens het spélen",
  body:`Lezen en doen gebeuren niet op hetzelfde moment. Bij een nieuwe opdracht verschijnt de tekst
  <b>groot (24 px)</b> met de video ernaast; zodra het kind begint te slepen of praten krimpt hij naar
  een <b>tikbare chip</b> — één tik maakt hem weer groot. Ook de stickerlade wordt dun zodra er een
  sticker gekozen is. Niets verdwijnt, alles krijgt ruimte op zíjn moment.`,
  gains:[["+76 px","tijdens spelen"],["24 px","bij lezen",1]],
  readPx:24, showToast:true, stackStyle:"gap:6px",
  kiesHead:(s)=>`<div class="plate rowc" style="padding:6px 10px;gap:8px">
      <div class="vid sm">🎬</div><div style="font-size:13px;font-weight:800;flex:1">Welke is de <span class="kw">krab</span>? <span style="color:#94a3b8">· tik voor groot</span></div>
      <div class="chip" style="font-size:11px">4/12</div></div>`,
  kiesFoot:()=>`<div class="plate rowc" style="padding:7px 10px;gap:8px">
    <div style="font-size:12px;font-weight:800;flex:1">Zeg na: <b>de krab</b></div>
    <div class="chip" style="background:#34d399;color:#053527">Volgende →</div></div>`,
  zetHead:(s)=>`<div class="plate rowc" style="padding:6px 10px;gap:8px">
      <div class="vid sm">🎬</div>
      <div style="font-size:13px;font-weight:800;flex:1">Zet de <span class="kw">boot</span> in de <span class="kw w">zee</span></div>
      <div style="font-size:11px;color:#94a3b8">tik ⤢</div></div>`,
  zetTray:()=>`<div class="tray"><div class="st">⛵</div><div class="st slim">🏐</div><div class="st slim">🦀</div><div class="st slim">🌞</div>
    <div style="font-size:11px;color:#0f172a;font-weight:800;opacity:.6">gekozen</div></div>`,
  zetMic:()=>`<div class="mic" style="height:52px">🎤 Zeg het${wave(5)}</div>`,
  vliegStatus:(s)=>`<div class="mic" style="height:52px">🎤 luistert${wave(5)}</div>`
},
{
  key:"v3", name:"Schermvullend", tag:"Het Vlieg-patroon overal doortrekken",
  headline:"Overal edge-to-edge speelveld met zwevende UI",
  body:`Zeg & Vlieg en Zeg & Zet gebruiken dit al: de scène loopt <b>tot de rand</b> en de bediening
  zweeft eroverheen. Kies het Woord zit nog in geneste panelen met dubbele marges. Trek het patroon
  door: kaarten en balken zweven op het strand. Dat scheelt de buitenmarges van elk paneel én maakt
  de vier modi consistent — een kind herkent dezelfde plekken overal.`,
  gains:[["+58 px","ruimte terug"],["20 px","instructie",1]],
  readPx:20, showToast:false, stackStyle:"padding:52px 10px 22px;gap:7px",
  kiesHead:(s)=>`<div class="plate rowc" style="padding:8px 10px;gap:8px">
      <div class="vid">🎬</div><div class="instr" style="flex:1;font-size:${s}px;padding:0">Welke is de <span class="kw">krab</span>?</div></div>`,
  kiesFoot:()=>`<div class="rowc" style="gap:8px">
      <div class="prog" style="flex:1"><i style="width:33%"></i></div>
      <div class="chip" style="background:#34d399;color:#053527">Volgende →</div></div>`,
  zetHead:(s)=>`<div class="plate rowc" style="padding:8px 10px;gap:8px">
      <div class="vid">🎬</div><div class="instr" style="flex:1;font-size:${s}px;padding:0">Zet de <span class="kw">boot</span> in de <span class="kw w">zee</span></div></div>`,
  zetTray:()=>`<div class="tray"><div class="st">⛵</div><div class="st">🏐</div><div class="st">🦀</div><div class="st">🌞</div></div>`,
  zetMic:()=>`<div class="mic" style="height:52px">🎤 Zeg het${wave(5)}</div>`,
  vliegStatus:(s)=>`<div class="mic" style="height:52px">🎤 luistert${wave(5)}</div>`
},
{
  key:"v4", name:"Zijrail", tag:"Vaste knoppen naar de zijkant",
  headline:"Verticale ruimte is schaars, horizontale niet",
  body:`In portret is hoogte het kostbaarst, maar alle vaste bediening (terug, hint, sterren,
  voortgang) staat juist in <b>volle-breedte balken boven én onder</b>. Zet die in een smalle
  <b>rail langs de rechterrand</b>, binnen duimbereik. Dat levert de hele bovenbalk én de 60 px
  statusbalk op: ruim <b>100 px</b> extra hoogte voor speelveld en tekst.`,
  gains:[["+104 px","ruimte terug"],["22 px","instructie",1]],
  readPx:22, showToast:false, railChrome:true, stackStyle:"padding:52px 80px 22px 16px;gap:8px",
  kiesHead:(s)=>`<div class="plate rowc" style="padding:9px 11px;gap:9px">
      <div class="vid">🎬</div><div class="instr" style="flex:1;font-size:${s}px;padding:0">Welke is de <span class="kw">krab</span>?</div></div>`,
  kiesFoot:()=>`<div class="plate rowc" style="padding:7px 10px;gap:8px">
      <div style="font-size:12px;font-weight:800;flex:1">Zeg na: <b>de krab</b></div>
      <div class="chip" style="background:#34d399;color:#053527">Volgende →</div></div>`,
  zetHead:(s)=>`<div class="plate instr" style="font-size:${s}px">Zet de <span class="kw">boot</span> in de <span class="kw w">zee</span></div>`,
  zetTray:()=>`<div class="tray"><div class="st">⛵</div><div class="st">🏐</div><div class="st">🦀</div><div class="st">🌞</div></div>`,
  zetMic:()=>`<div class="mic" style="height:52px">🎤 Zeg het${wave(4)}</div>`,
  vliegStatus:(s)=>`<div class="mic" style="height:50px">🎤 luistert${wave(5)}</div>`
},
{
  key:"v5", name:"Leesbalk-eerst", tag:"Typografie bepaalt het raster",
  headline:"De leesregel is heilig; de rest past zich aan",
  body:`Omgekeerd ontwerpen: eerst een <b>vaste leesbalk</b> die altijd op dezelfde plek staat en
  gegarandeerd <b>22 px</b> is, met max ±32 tekens en de kernwoorden gekleurd. Pas daarna verdelen we
  wat overblijft. Groeit de systeemletter van het toestel, dan krimpt het speelveld — nooit de tekst.
  Voor beginnende lezers is dat de veiligste keuze; het kost wel de meeste ruimte.`,
  gains:[["+34 px","ruimte terug"],["22 px","gegarandeerd",1]],
  readPx:22, showToast:false,
  kiesHead:(s)=>`<div class="plate instr" style="font-size:${s}px;border-left:5px solid #38bdf8">
      Welke is de <span class="kw">krab</span>?</div>
      <div class="rowc" style="gap:8px"><div class="vid sm">🎬</div>
      <div class="prog" style="flex:1"><i style="width:33%"></i></div>
      <div class="chip" style="font-size:11px">4/12</div></div>`,
  kiesFoot:()=>`<div class="plate rowc" style="padding:7px 10px;gap:8px">
      <div style="font-size:13px;font-weight:800;flex:1">Zeg na: <b>de krab</b></div>
      <div class="chip" style="background:#34d399;color:#053527">Volgende →</div></div>`,
  zetHead:(s)=>`<div class="plate instr" style="font-size:${s}px;border-left:5px solid #38bdf8">
      Zet de <span class="kw">boot</span> in de <span class="kw w">zee</span></div>
      <div class="rowc" style="gap:8px"><div class="vid sm">🎬</div>
      <div class="mic" style="flex:1;height:44px">🎤 Zeg het${wave(4)}</div></div>`,
  zetTray:()=>`<div class="tray"><div class="st">⛵</div><div class="st">🏐</div><div class="st">🦀</div><div class="st">🌞</div></div>`,
  zetMic:()=>``,
  vliegStatus:(s)=>`<div class="plate instr" style="font-size:${s}px;border-left:5px solid #38bdf8">Noem wat je ziet</div>
      <div class="mic" style="height:46px">🎤 luistert${wave(5)}</div>`
}];

const FUNCS = {
  "Kies het Woord":["terug naar menu","hint-knop","sterrenteller","video-opdracht (autoplay)",
    "vraagtekst","4 antwoordkaarten","goed/fout-markering","feedback + « Zeg na: »",
    "beloningsmelding","Volgende-knop","voortgang 4/12"],
  "Zeg & Zet":["terug naar menu","hint (+ hintvideo)","sterrenteller","video-opdracht",
    "opdrachttekst","microfoon","typen-alternatief","doelzones","stickerlade (sleep + tik)",
    "succes-toast","spraakwave","foutherstel"],
  "Zeg & Vlieg":["terug naar menu","schildjes","afstand","record","combo","duim-rail",
    "mic-status (luistert doorlopend)","spraakwave","feedback"]
};

const MODES=[["Kies het Woord","kies",renderKies],["Zeg & Zet","zet",renderZet],
             ["Zeg & Vlieg","vlieg",renderVlieg]];

const tabs=document.getElementById("tabs"), panes=document.getElementById("panes");

P.forEach((p,i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.dataset.id=p.key;
  b.innerHTML=`<b>${i+1}. ${p.name}</b>${p.tag}`;
  b.onclick=()=>show(p.key); tabs.appendChild(b);

  const pane=document.createElement("div");
  pane.className="pane"; pane.dataset.pane=p.key;
  pane.innerHTML=`
    <div class="strategy"><h2>${p.headline}</h2><p>${p.body}</p>
      <div class="gainrow">${p.gains.map(g=>
        `<div class="gain ${g[2]?"read":""}"><b>${g[0]}</b>${g[1]}</div>`).join("")}
        <div class="gain"><b>100%</b>functies behouden</div></div></div>
    <div class="phones">${MODES.map(([label,key,fn])=>`
      <div class="col"><div class="cap">${label}<span>alle functies aanwezig</span></div>
        <div class="frame"><div class="scaler"><div class="phone"><div class="island"></div>
          <div class="screen">${fn(p)}</div></div></div></div></div>`).join("")}</div>
    <div class="checks">${Object.entries(FUNCS).map(([m,list])=>`
      <div class="ck"><h4>${m} — functiecheck</h4>
      <ul>${list.map(f=>`<li>${f}</li>`).join("")}</ul></div>`).join("")}</div>`;
  panes.appendChild(pane);
});

function show(id){
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.dataset.pane===id));
  [...tabs.children].forEach(b=>b.setAttribute("aria-selected",String(b.dataset.id===id)));
}
show("v1");
</script>
</body>
</html>
