<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo Varianten</title>
    <style>
      :root {
        font-family:
          "Arial Rounded MT Bold",
          "Avenir Next Rounded",
          "Helvetica Rounded",
          "Trebuchet MS",
          Arial,
          sans-serif;
        color: #102b46;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1400px;
        height: 1200px;
        margin: 0;
        overflow: hidden;
        background: linear-gradient(180deg, #c9f2ff 0%, #fff5c8 100%);
      }

      .sheet {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 34px;
        width: 100%;
        height: 100%;
        padding: 40px;
      }

      .card {
        position: relative;
        display: grid;
        min-width: 0;
        place-items: center;
        overflow: hidden;
        border: 8px solid #ffffff;
        border-radius: 46px;
        background:
          radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.82), transparent 21%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.32));
        box-shadow: 0 14px 0 rgba(24, 82, 120, 0.16);
      }

      .label {
        position: absolute;
        top: 22px;
        left: 24px;
        z-index: 4;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        border: 4px solid #ffffff;
        border-radius: 18px;
        background: #ffd94f;
        padding: 0 18px;
        box-shadow: 0 5px 0 rgba(24, 82, 120, 0.16);
        font-size: 25px;
        font-weight: 1000;
      }

      .logo {
        position: relative;
        width: 92%;
        height: 75%;
        display: grid;
        place-items: center;
      }

      .stack {
        position: relative;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 11px 0 rgba(16, 64, 105, 0.17));
      }

      .line {
        position: absolute;
        left: 50%;
        display: block;
        width: 100%;
        transform: translateX(-50%);
        font-weight: 1000;
        line-height: 0.86;
        text-align: center;
        white-space: nowrap;
        -webkit-text-stroke: 8px #ffffff;
        paint-order: stroke fill;
        text-shadow:
          4px 4px 0 #165c9f,
          -4px 4px 0 #165c9f,
          4px -4px 0 #165c9f,
          -4px -4px 0 #165c9f;
      }

      .plus {
        color: #ffd23f;
      }

      .word {
        color: #ffffff;
      }

      .bezem {
        color: #ffd23f;
      }

      .escape {
        color: #45d2b6;
      }

      .variant-a .stack {
        transform: rotate(-3deg);
      }

      .variant-a .plus {
        top: 6%;
        font-size: 82px;
      }

      .variant-a .word {
        top: 27%;
        font-size: 74px;
      }

      .variant-a .bezem {
        top: 43%;
        font-size: 118px;
      }

      .variant-a .escape {
        top: 66%;
        font-size: 88px;
      }

      .variant-b .stack {
        transform: rotate(1deg);
      }

      .variant-b .plus {
        top: 9%;
        left: 24%;
        width: auto;
        border: 7px solid #ffffff;
        border-radius: 24px;
        background: #165c9f;
        padding: 0 18px;
        font-size: 74px;
        text-shadow: none;
        -webkit-text-stroke: 4px #ffffff;
      }

      .variant-b .word {
        top: 27%;
        color: #165c9f;
        font-size: 68px;
        -webkit-text-stroke: 10px #ffffff;
        text-shadow:
          5px 5px 0 rgba(22, 92, 159, 0.28),
          -3px 3px 0 rgba(22, 92, 159, 0.18);
      }

      .variant-b .bezem {
        top: 43%;
        color: #ffbd2f;
        font-size: 116px;
      }

      .variant-b .escape {
        top: 65%;
        color: #35c5aa;
        font-size: 86px;
      }

      .variant-c .badge {
        position: absolute;
        inset: 13% 3% 11%;
        border: 13px solid #ffffff;
        border-radius: 54px;
        background: linear-gradient(180deg, #1b78c8 0%, #165c9f 100%);
        transform: rotate(-2deg);
        box-shadow: 0 10px 0 rgba(16, 64, 105, 0.22);
      }

      .variant-c .line {
        text-shadow: none;
        -webkit-text-stroke: 7px #ffffff;
      }

      .variant-c .plus {
        top: 8%;
        color: #ffd23f;
        font-size: 78px;
      }

      .variant-c .word {
        top: 28%;
        color: #ffffff;
        font-size: 62px;
      }

      .variant-c .bezem {
        top: 43%;
        color: #ffd23f;
        font-size: 116px;
      }

      .variant-c .escape {
        top: 66%;
        color: #68f0d2;
        font-size: 80px;
      }

      .variant-d .stack {
        transform: rotate(-2deg);
      }

      .variant-d .plus {
        top: 6%;
        color: #ffd23f;
        font-size: 82px;
      }

      .variant-d .word {
        top: 28%;
        color: #ffffff;
        font-size: 69px;
      }

      .variant-d .bezem {
        top: 43%;
        color: #ffcd39;
        font-size: 112px;
      }

      .variant-d .escape {
        top: 65%;
        color: #49d2b5;
        font-size: 86px;
      }

      .wave {
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: 10%;
        height: 52px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffd94f, #ffa7c5, #8fdcff, #82efbd);
        opacity: 0.88;
        transform: rotate(-4deg);
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <section class="card variant-a">
        <span class="label">A</span>
        <div class="logo">
          <div class="stack">
            <span class="line plus">+1</span>
            <span class="line word">Woordenschat</span>
            <span class="line bezem">Bezem</span>
            <span class="line escape">Escape</span>
          </div>
        </div>
      </section>

      <section class="card variant-b">
        <span class="label">B</span>
        <div class="logo">
          <div class="stack">
            <span class="line plus">+1</span>
            <span class="line word">Woordenschat</span>
            <span class="line bezem">Bezem</span>
            <span class="line escape">Escape</span>
          </div>
        </div>
      </section>

      <section class="card variant-c">
        <span class="label">C</span>
        <div class="logo">
          <div class="badge"></div>
          <div class="stack">
            <span class="line plus">+1</span>
            <span class="line word">Woordenschat</span>
            <span class="line bezem">Bezem</span>
            <span class="line escape">Escape</span>
          </div>
        </div>
      </section>

      <section class="card variant-d">
        <span class="label">D</span>
        <div class="logo">
          <div class="wave"></div>
          <div class="stack">
            <span class="line plus">+1</span>
            <span class="line word">Woordenschat</span>
            <span class="line bezem">Bezem</span>
            <span class="line escape">Escape</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
