<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wereldkeuze Concept Visualisatie</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Nunito, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #bdeeff;
      }

      body {
        display: grid;
        place-items: center;
      }

      .screen {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #bdeeff;
        color: #15304a;
      }

      .background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 240, 178, 0.26)),
          radial-gradient(circle at 50% 8%, rgba(255, 255, 255, 0.72), transparent 38%),
          radial-gradient(circle at 12% 78%, rgba(255, 210, 88, 0.28), transparent 34%);
      }

      .topbar {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        right: 12px;
        z-index: 10;
        display: grid;
        grid-template-columns: 48px 1fr auto;
        align-items: center;
        gap: 10px;
      }

      .icon-button,
      .score-pill {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border: 4px solid #ffffff;
        box-shadow: 0 5px 0 rgba(21, 48, 74, 0.18);
        font-weight: 1000;
      }

      .icon-button {
        width: 48px;
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.95);
      }

      .title-pill {
        min-height: 48px;
        border: 4px solid #ffffff;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.93);
        box-shadow: 0 5px 0 rgba(21, 48, 74, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(18px, 5vw, 24px);
        font-weight: 1000;
        line-height: 1;
      }

      .score-pill {
        gap: 7px;
        padding: 0 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.95);
        font-size: 18px;
      }

      .content {
        position: absolute;
        inset: 78px 14px 104px;
        z-index: 5;
        display: grid;
        grid-template-rows: 138px minmax(0, 1fr);
        gap: 10px;
      }

      .featured {
        position: relative;
        overflow: hidden;
        border: 5px solid #ffffff;
        border-radius: 26px;
        background:
          linear-gradient(135deg, rgba(110, 226, 224, 0.92), rgba(255, 223, 103, 0.88)),
          rgba(255, 255, 255, 0.88);
        box-shadow: 0 7px 0 rgba(21, 48, 74, 0.18);
      }

      .featured-copy {
        position: relative;
        z-index: 3;
        width: 63%;
        padding: 18px 0 0 18px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        background: #ffffff;
        padding: 5px 10px;
        color: #08756f;
        font-size: 12px;
        font-weight: 1000;
        box-shadow: 0 3px 0 rgba(21, 48, 74, 0.12);
      }

      .featured h1 {
        margin: 10px 0 2px;
        font-size: 34px;
        font-weight: 1000;
        line-height: 0.9;
        color: #0b4978;
        text-shadow: 0 2px 0 #ffffff;
      }

      .featured p {
        margin: 0;
        max-width: 210px;
        color: #15304a;
        font-size: 13px;
        font-weight: 900;
        line-height: 1.15;
      }

      .beach-items {
        position: absolute;
        right: 8px;
        bottom: 4px;
        z-index: 2;
        width: 42%;
        height: 84%;
      }

      .beach-items img {
        position: absolute;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 5px 0 rgba(21, 48, 74, 0.14));
      }

      .beach-shells {
        right: 4%;
        bottom: 3%;
        width: 54%;
      }

      .beach-umbrella {
        right: 22%;
        bottom: 18%;
        width: 62%;
        transform: rotate(-6deg);
      }

      .mascot {
        position: absolute;
        right: -2%;
        top: 4%;
        z-index: 3;
        width: 30%;
        max-width: 90px;
        filter: drop-shadow(0 6px 0 rgba(21, 48, 74, 0.16));
      }

      .world-grid {
        display: grid;
        min-width: 0;
        min-height: 0;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .world-card {
        position: relative;
        min-width: 0;
        min-height: 100px;
        overflow: hidden;
        border: 4px solid #ffffff;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 6px 0 rgba(21, 48, 74, 0.15);
      }

      .world-card.selected {
        border-width: 5px;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.92), rgba(187, 247, 208, 0.95)),
          #ffffff;
        box-shadow:
          0 7px 0 rgba(21, 48, 74, 0.18),
          0 0 0 4px rgba(52, 211, 153, 0.38);
      }

      .world-card.later {
        opacity: 0.82;
      }

      .world-card::before {
        position: absolute;
        inset: 0;
        content: "";
        opacity: 0.52;
      }

      .world-card.farm::before {
        background: linear-gradient(135deg, #c9f7b8, #ffcfbd);
      }

      .world-card.zoo::before {
        background: linear-gradient(135deg, #c6f6c9, #ffd091);
      }

      .world-card.playground::before {
        background: linear-gradient(135deg, #b9e8ff, #ffd4e5);
      }

      .world-card.school::before {
        background: linear-gradient(135deg, #cfe8ff, #ffe68d);
      }

      .world-card.space::before {
        background: linear-gradient(135deg, #cdd7ff, #efe1ff);
      }

      .world-icon {
        position: absolute;
        left: 10px;
        top: 12px;
        z-index: 2;
        display: grid;
        width: 45px;
        height: 45px;
        place-items: center;
        border: 3px solid #ffffff;
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 0 rgba(21, 48, 74, 0.12);
      }

      .world-icon svg {
        width: 29px;
        height: 29px;
        stroke: #15304a;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .world-card h2 {
        position: absolute;
        left: 12px;
        right: 10px;
        bottom: 33px;
        z-index: 2;
        margin: 0;
        color: #15304a;
        font-size: 18px;
        font-weight: 1000;
        line-height: 1;
      }

      .status-chip {
        position: absolute;
        left: 10px;
        bottom: 9px;
        z-index: 2;
        display: inline-flex;
        min-height: 22px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        padding: 0 9px;
        color: #15304a;
        font-size: 11px;
        font-weight: 1000;
      }

      .selected .status-chip {
        background: #d1fae5;
        color: #047857;
      }

      .lock {
        position: absolute;
        right: 10px;
        top: 10px;
        z-index: 3;
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 3px solid #ffffff;
        border-radius: 50%;
        background: #ffe58a;
        box-shadow: 0 3px 0 rgba(21, 48, 74, 0.16);
      }

      .lock svg {
        width: 15px;
        height: 15px;
        stroke: #15304a;
        stroke-width: 3;
        fill: none;
      }

      .check {
        position: absolute;
        right: 9px;
        top: 9px;
        z-index: 3;
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 3px solid #ffffff;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 3px 0 rgba(21, 48, 74, 0.16);
      }

      .check svg {
        width: 17px;
        height: 17px;
        stroke: #ffffff;
        stroke-width: 4;
        fill: none;
      }

      .bottom-action {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 12;
      }

      .start-button {
        display: flex;
        width: 100%;
        min-height: 64px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: 5px solid #ffffff;
        border-radius: 25px;
        background: linear-gradient(180deg, #73dc60, #33b93f);
        color: #ffffff;
        font-size: 23px;
        font-weight: 1000;
        line-height: 1;
        box-shadow: 0 7px 0 rgba(21, 48, 74, 0.2);
      }

      .play-circle {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        color: #33b93f;
      }

      .play-circle svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      @media (orientation: landscape) {
        .background {
          content: url("../assets/backgrounds/beach-board-landscape.png");
        }

        .topbar {
          grid-template-columns: 48px 260px auto;
        }

        .content {
          inset: 74px 18px 16px;
          grid-template-columns: minmax(250px, 36%) minmax(0, 1fr);
          grid-template-rows: 1fr;
          gap: 14px;
        }

        .featured {
          min-height: 0;
        }

        .featured-copy {
          width: 72%;
          padding: 18px 0 0 18px;
        }

        .featured h1 {
          font-size: 35px;
        }

        .featured p {
          font-size: 13px;
        }

        .mascot {
          width: 31%;
        }

        .world-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 10px;
          align-content: stretch;
        }

        .world-card {
          min-height: 0;
        }

        .world-card h2 {
          font-size: 17px;
        }

        .bottom-action {
          left: 32px;
          right: auto;
          bottom: 26px;
          width: min(31vw, 280px);
        }

        .start-button {
          min-height: 58px;
          font-size: 20px;
        }
      }

      @media (orientation: portrait) {
        body {
          place-items: start;
        }

        .screen {
          width: 390px;
          max-width: 100vw;
        }

        .topbar {
          right: auto;
          width: min(366px, calc(100vw - 24px));
          grid-template-columns: 48px minmax(0, 1fr) 78px;
        }

        .title-pill {
          font-size: 22px;
        }

        .score-pill {
          gap: 5px;
          padding: 0 8px;
          font-size: 16px;
        }

        .content {
          right: auto;
          width: min(362px, calc(100vw - 28px));
        }

        .featured,
        .world-grid {
          width: min(362px, calc(100vw - 28px));
        }

        .world-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .bottom-action {
          right: auto;
          width: min(354px, calc(100vw - 36px));
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" aria-label="Wereldkeuze concept">
      <img class="background" src="../assets/backgrounds/beach-board-portrait.png" alt="" />
      <div class="shade"></div>

      <header class="topbar">
        <div class="icon-button" aria-label="Terug">
          <svg width="27" height="27" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5 8 12l7 7" fill="none" stroke="#15304a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="title-pill">Kies wereld</div>
        <div class="score-pill">
          <svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m12 2.9 2.7 5.4 6 .9-4.3 4.2 1 6-5.4-2.9-5.4 2.9 1-6-4.3-4.2 6-.9L12 2.9Z" fill="#ffd13d" stroke="#c88912" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
          120
        </div>
      </header>

      <section class="content">
        <article class="featured" aria-label="Geselecteerde wereld Strand">
          <div class="featured-copy">
            <span class="eyebrow">Open</span>
            <h1>Strand</h1>
            <p>Woorden plaatsen, luisteren en daarna racen.</p>
          </div>
          <img class="mascot" src="../assets/icons/mascot/mascot-05-celebration.png" alt="" />
          <div class="beach-items">
            <img class="beach-umbrella" src="../assets/objects/transparent/beach-umbrella-sticker.png" alt="" />
            <img class="beach-shells" src="../assets/objects/transparent/seashells-sticker.png" alt="" />
          </div>
        </article>

        <section class="world-grid" aria-label="Werelden">
          <article class="world-card selected">
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" /></svg>
            </span>
            <span class="world-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 15c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2" /><path d="M5 19c2 0 2-1.4 4-1.4s2 1.4 4 1.4 2-1.4 4-1.4 2 1.4 4 1.4" /></svg>
            </span>
            <h2>Strand</h2>
            <span class="status-chip">Open</span>
          </article>

          <article class="world-card later farm">
            <span class="lock" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3" /><rect x="5" y="11" width="14" height="10" rx="2" /></svg>
            </span>
            <span class="world-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11" /><path d="M8 20v-7h8v7" /><path d="M7 10h10" /></svg>
            </span>
            <h2>Boerderij</h2>
            <span class="status-chip">Komt later</span>
          </article>

          <article class="world-card later zoo">
            <span class="lock" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3" /><rect x="5" y="11" width="14" height="10" rx="2" /></svg>
            </span>
            <span class="world-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2" /><circle cx="17" cy="8" r="2" /><circle cx="9" cy="16" r="2" /><circle cx="15" cy="16" r="2" /><path d="M9 12c1.2-2 4.8-2 6 0" /></svg>
            </span>
            <h2>Dierentuin</h2>
            <span class="status-chip">Komt later</span>
          </article>

          <article class="world-card later playground">
            <span class="lock" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3" /><rect x="5" y="11" width="14" height="10" rx="2" /></svg>
            </span>
            <span class="world-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 20 16 6" /><path d="M13 6h5v14" /><path d="M5 20h14" /></svg>
            </span>
            <h2>Speeltuin</h2>
            <span class="status-chip">Komt later</span>
          </article>

          <article class="world-card later school">
            <span class="lock" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3" /><rect x="5" y="11" width="14" height="10" rx="2" /></svg>
            </span>
            <span class="world-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 5h10a4 4 0 0 1 4 4v10H9a4 4 0 0 0-4-4V5Z" /><path d="M5 15V5" /></svg>
            </span>
            <h2>School</h2>
            <span class="status-chip">Komt later</span>
          </article>

          <article class="world-card later space">
            <span class="lock" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3" /><rect x="5" y="11" width="14" height="10" rx="2" /></svg>
            </span>
            <span class="world-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" /><path d="M4 14c4-5 12-7 16-4" /><path d="m18 4 1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2Z" /></svg>
            </span>
            <h2>Ruimte</h2>
            <span class="status-chip">Komt later</span>
          </article>
        </section>
      </section>

      <section class="bottom-action">
        <div class="start-button">
          <span class="play-circle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z" /></svg>
          </span>
          Start wereld
        </div>
      </section>
    </main>
  </body>
</html>
