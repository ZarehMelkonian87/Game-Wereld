<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Start Logo V3 Source</title>
    <style>
      html,
      body {
        width: 1400px;
        height: 900px;
        margin: 0;
        overflow: hidden;
        background: #00ff00;
      }

      body {
        display: grid;
        place-items: center;
      }

      svg {
        display: block;
        width: 1400px;
        height: 900px;
        overflow: visible;
      }

      .logo-text {
        font-family:
          "Arial Rounded MT Bold",
          "Avenir Next Rounded",
          "Helvetica Rounded",
          "Trebuchet MS",
          Arial,
          sans-serif;
        font-weight: 900;
        letter-spacing: 0;
        paint-order: stroke fill;
        stroke-linejoin: round;
        stroke-linecap: round;
        text-anchor: middle;
      }

      .shadow {
        fill: none;
        stroke: rgba(10, 76, 120, 0.26);
        stroke-width: 28;
        transform: translate(12px, 18px);
      }

      .outer {
        fill: none;
        stroke: #ffffff;
        stroke-width: 54;
      }

      .blue {
        fill: none;
        stroke: #165c9f;
        stroke-width: 34;
      }

      .inner {
        stroke: #ffffff;
        stroke-width: 12;
      }

      .plus-fill {
        fill: #ffd83f;
      }

      .word-fill {
        fill: #ffffff;
      }

      .broom-fill {
        fill: #ffd23b;
      }

      .escape-fill {
        fill: #42d2b4;
      }

      .shine {
        fill: none;
        stroke: rgba(255, 255, 255, 0.64);
        stroke-width: 18;
        stroke-linecap: round;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1400 900" aria-label="+1 Woordenschat Bezem Escape">
      <g transform="rotate(-3 700 450)">
        <path d="M250 180 l28 40 48 0 -39 28 15 46 -39 -28 -39 28 15 -46 -39 -28 48 0z" fill="#fff5bb" stroke="#ffffff" stroke-width="20" />
        <path d="M1120 514 l17 25 31 0 -25 18 10 30 -26 -18 -25 18 10 -30 -25 -18 31 0z" fill="#fff5bb" stroke="#ffffff" stroke-width="14" />

        <text class="logo-text shadow" x="700" y="170" font-size="156">+1</text>
        <text class="logo-text outer" x="700" y="170" font-size="156">+1</text>
        <text class="logo-text blue" x="700" y="170" font-size="156">+1</text>
        <text class="logo-text inner plus-fill" x="700" y="170" font-size="156">+1</text>

        <text class="logo-text shadow" x="700" y="330" font-size="142">Woordenschat</text>
        <text class="logo-text outer" x="700" y="330" font-size="142">Woordenschat</text>
        <text class="logo-text blue" x="700" y="330" font-size="142">Woordenschat</text>
        <text class="logo-text inner word-fill" x="700" y="330" font-size="142">Woordenschat</text>

        <text class="logo-text shadow" x="700" y="510" font-size="216">Bezem</text>
        <text class="logo-text outer" x="700" y="510" font-size="216">Bezem</text>
        <text class="logo-text blue" x="700" y="510" font-size="216">Bezem</text>
        <text class="logo-text inner broom-fill" x="700" y="510" font-size="216">Bezem</text>
        <path class="shine" d="M405 446 C520 410 692 410 825 438" />

        <text class="logo-text shadow" x="700" y="675" font-size="158">Escape</text>
        <text class="logo-text outer" x="700" y="675" font-size="158">Escape</text>
        <text class="logo-text blue" x="700" y="675" font-size="158">Escape</text>
        <text class="logo-text inner escape-fill" x="700" y="675" font-size="158">Escape</text>
      </g>
    </svg>
  </body>
</html>
