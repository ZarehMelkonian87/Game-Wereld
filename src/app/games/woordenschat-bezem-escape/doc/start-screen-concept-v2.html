<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Startscherm Concept V2</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Nunito, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f5fbff;
      }

      body {
        display: grid;
        place-items: center;
      }

      .screen {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #bdeeff;
      }

      .background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 247, 211, 0.24)),
          radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.76), transparent 34%),
          radial-gradient(circle at 28% 78%, rgba(255, 222, 115, 0.42), transparent 32%);
      }

      .top-bar {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: 14px;
        right: 14px;
        z-index: 4;
        height: 50px;
      }

      .icon-button,
      .score-pill,
      .settings-pill {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        z-index: 10;
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 4px solid #ffffff;
        box-shadow: 0 5px 0 rgba(21, 48, 74, 0.18);
        color: #15304a;
        font-weight: 1000;
      }

      .icon-button {
        left: 14px;
        width: 48px;
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.94);
      }

      .score-pill {
        left: 50%;
        transform: translateX(-50%);
        gap: 7px;
        padding: 0 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.94);
        font-size: 20px;
      }

      .settings-pill {
        right: 14px;
        gap: 7px;
        padding: 0 13px;
        border-radius: 18px;
        background: linear-gradient(180deg, #ffe982, #ffc93d);
        font-size: 16px;
      }

      .logo {
        position: absolute;
        z-index: 3;
        width: min(91vw, 358px);
        left: 50%;
        top: 70px;
        transform: translateX(-50%) rotate(-2deg);
        text-align: center;
        filter: drop-shadow(0 8px 0 rgba(21, 48, 74, 0.16));
      }

      .logo-image {
        display: block;
        width: 100%;
        height: auto;
      }

      .hero {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 304px;
        width: min(82vw, 340px);
        transform: translateX(-50%);
      }

      .hero::before {
        position: absolute;
        left: 16%;
        top: 44%;
        width: 70%;
        height: 26%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffe979, #ffabc9, #99dcff, #b6f7cf);
        content: "";
        filter: blur(3px);
        opacity: 0.76;
        transform: rotate(-14deg);
      }

      .avatar {
        position: relative;
        z-index: 2;
        width: 78%;
        transform: rotate(-7deg);
        filter: drop-shadow(0 9px 0 rgba(21, 48, 74, 0.18));
      }

      .mascot {
        position: absolute;
        z-index: 1;
        right: -4%;
        top: 12%;
        width: 34%;
        transform: rotate(10deg);
        filter: drop-shadow(0 7px 0 rgba(21, 48, 74, 0.14));
      }

      .spark {
        position: absolute;
        z-index: 2;
        width: 18px;
        height: 18px;
        transform: rotate(45deg);
        border-radius: 4px;
        background: #ffffff;
        box-shadow:
          0 0 0 4px #ffd13d,
          0 5px 0 rgba(21, 48, 74, 0.12);
      }

      .spark.one {
        left: 24px;
        top: 386px;
      }

      .spark.two {
        right: 30px;
        top: 388px;
        width: 13px;
        height: 13px;
      }

      .spark.three {
        right: 74px;
        top: 516px;
        width: 15px;
        height: 15px;
      }

      .actions {
        position: absolute;
        z-index: 5;
        left: 22px;
        right: 22px;
        bottom: max(12px, env(safe-area-inset-bottom));
        display: grid;
        gap: 10px;
      }

      .play-button,
      .parent-button {
        display: flex;
        min-height: 62px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: 5px solid #ffffff;
        border-radius: 25px;
        color: #ffffff;
        font-size: 24px;
        font-weight: 1000;
        text-align: center;
        box-shadow: 0 7px 0 rgba(21, 48, 74, 0.2);
      }

      .play-button {
        background: linear-gradient(180deg, #73dc60, #33b93f);
      }

      .parent-button {
        min-height: 52px;
        background: linear-gradient(180deg, #55b8ff, #1675dc);
        font-size: 18px;
      }

      .button-icon {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        color: #33b93f;
      }

      .parent-button .button-icon {
        color: #1675dc;
      }

      .settings-portrait-button {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 328px;
        z-index: 30;
        display: none;
        width: 48px;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 4px solid #ffffff;
        border-radius: 17px;
        background: linear-gradient(180deg, #ffe982, #ffc93d);
        color: #15304a;
        box-shadow: 0 5px 0 rgba(21, 48, 74, 0.18);
      }

      @media (orientation: portrait) {
        .logo {
          left: 48%;
          top: 86px;
          width: min(74vw, 290px);
        }

        .actions {
          left: 6%;
          right: auto;
          width: 78vw;
          max-width: 305px;
          transform: none;
        }

        .settings-pill {
          display: none;
        }

        .settings-portrait-button {
          display: inline-flex;
        }
      }

      svg {
        display: block;
      }

      @media (orientation: landscape) {
        .screen {
          background: #bdeeff;
        }

        .background {
          content: url("../assets/backgrounds/beach-board-landscape.png");
        }

        .top-bar {
          top: 12px;
          left: 14px;
          right: 14px;
        }

        .logo {
          left: 27%;
          top: 44px;
          width: min(36vw, 310px);
          transform: translateX(-50%) rotate(-2deg);
        }

        .hero {
          left: 72%;
          top: 82px;
          width: min(39vw, 330px);
        }

        .actions {
          left: 54px;
          right: auto;
          bottom: 18px;
          width: min(38vw, 320px);
          gap: 10px;
          transform: none;
        }

        .play-button {
          min-height: 62px;
        }

        .parent-button {
          min-height: 54px;
          font-size: 16px;
        }

        .spark.one {
          left: 410px;
          top: 82px;
        }

        .spark.two {
          right: 44px;
          top: 102px;
        }

        .spark.three {
          right: 372px;
          top: 192px;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" aria-label="Startscherm concept V2">
      <img class="background" src="../assets/backgrounds/beach-board-portrait.png" alt="" />
      <div class="shade"></div>

      <div class="top-bar">
        <div class="icon-button" aria-label="Geluid">
          <svg width="27" height="27" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="none" stroke="#15304a" stroke-width="2.8" stroke-linejoin="round" />
            <path d="M16 8c1.2 1.1 1.9 2.5 1.9 4s-.7 2.9-1.9 4" fill="none" stroke="#15304a" stroke-width="2.8" stroke-linecap="round" />
          </svg>
        </div>

        <div class="score-pill" aria-label="Sterren">
          <svg width="27" height="27" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m12 2.9 2.7 5.4 6 .9-4.3 4.2 1 6-5.4-2.9-5.4 2.9 1-6-4.3-4.2 6-.9L12 2.9Z" fill="#ffd13d" stroke="#c88912" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
          120
        </div>

        <div class="settings-pill" aria-label="Instellingen">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z" fill="none" stroke="#15304a" stroke-width="2.5" />
            <path d="M19 12a7.3 7.3 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a8.2 8.2 0 0 0-1.8-1L14.4 3h-4.8L9.3 6a8.2 8.2 0 0 0-1.8 1l-2.4-1-2 3.5 2 1.5a7.3 7.3 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a8.2 8.2 0 0 0 1.8 1l.3 3h4.8l.3-3a8.2 8.2 0 0 0 1.8-1l2.4 1 2-3.5-2-1.5c.1-.3.1-.6.1-1Z" fill="none" stroke="#15304a" stroke-width="2.1" stroke-linejoin="round" />
          </svg>
          <span class="settings-text">Opties</span>
        </div>
      </div>

      <div class="settings-portrait-button" aria-label="Instellingen">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z" fill="none" stroke="#15304a" stroke-width="2.5" />
          <path d="M19 12a7.3 7.3 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a8.2 8.2 0 0 0-1.8-1L14.4 3h-4.8L9.3 6a8.2 8.2 0 0 0-1.8 1l-2.4-1-2 3.5 2 1.5a7.3 7.3 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a8.2 8.2 0 0 0 1.8 1l.3 3h4.8l.3-3a8.2 8.2 0 0 0 1.8-1l2.4 1 2-3.5-2-1.5c.1-.3.1-.6.1-1Z" fill="none" stroke="#15304a" stroke-width="2.1" stroke-linejoin="round" />
        </svg>
      </div>

      <section class="logo" aria-label="+1 Woordenschat Bezem Escape">
        <img
          class="logo-image"
          src="../assets/logos/start-logo-b-generated-magenta.png"
          alt="+1 Woordenschat Bezem Escape"
        />
      </section>

      <section class="hero" aria-hidden="true">
        <img class="mascot" src="../assets/icons/mascot/mascot-05-celebration.png" alt="" />
        <img class="avatar" src="../assets/icons/avatars/avatar-01.png" alt="" />
      </section>

      <span class="spark one"></span>
      <span class="spark two"></span>
      <span class="spark three"></span>

      <section class="actions">
        <div class="play-button">
          <span class="button-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7L8 5Z" fill="currentColor" />
            </svg>
          </span>
          Spelen
        </div>
        <div class="parent-button">
          <span class="button-icon">
            <svg width="23" height="23" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM3.5 20a5 5 0 0 1 9 0H3.5Zm8 0a5 5 0 0 1 9 0h-9Z" fill="currentColor" />
            </svg>
          </span>
          Ouders &amp; Therapeuten
        </div>
      </section>
    </main>
  </body>
</html>
