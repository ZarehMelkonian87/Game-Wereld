<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Start Logo V2 Source</title>
    <style>
      :root {
        font-family:
          Nunito, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html,
      body {
        width: 1600px;
        height: 900px;
        margin: 0;
        overflow: hidden;
        background: #00ff00;
      }

      .logo {
        position: relative;
        width: 1600px;
        height: 900px;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 18px 0 rgba(17, 82, 142, 0.24));
      }

      .stack {
        position: relative;
        width: 1360px;
        height: 760px;
        transform: rotate(-2deg);
      }

      .spark {
        position: absolute;
        border-radius: 22px;
        background: #fff7c8;
        transform: rotate(45deg);
        box-shadow:
          0 0 0 14px #ffffff,
          0 0 0 23px #1b5d9f,
          0 12px 0 rgba(17, 82, 142, 0.18);
      }

      .spark.one {
        top: 88px;
        left: 190px;
        width: 64px;
        height: 64px;
      }

      .spark.two {
        right: 98px;
        top: 418px;
        width: 42px;
        height: 42px;
      }

      .line {
        position: absolute;
        left: 50%;
        display: block;
        width: 100%;
        transform: translateX(-50%);
        color: #ffffff;
        font-weight: 1000;
        letter-spacing: 0;
        line-height: 0.84;
        text-align: center;
        white-space: nowrap;
        -webkit-text-stroke: 18px #ffffff;
        paint-order: stroke fill;
      }

      .line::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        color: transparent;
        content: attr(data-text);
        -webkit-text-stroke: 48px #1b5d9f;
      }

      .line::after {
        position: absolute;
        inset: 0;
        z-index: -2;
        color: transparent;
        content: attr(data-text);
        -webkit-text-stroke: 64px #ffffff;
      }

      .plus {
        top: 0;
        color: #ffd23d;
        font-size: 170px;
        transform: translateX(-50%) rotate(4deg);
        -webkit-text-stroke: 14px #ffffff;
      }

      .plus::before {
        -webkit-text-stroke: 40px #1b5d9f;
      }

      .plus::after {
        -webkit-text-stroke: 56px #ffffff;
      }

      .word {
        top: 188px;
        color: #ffffff;
        font-size: 148px;
      }

      .broom {
        top: 318px;
        color: #ffd23d;
        font-size: 238px;
      }

      .escape {
        top: 520px;
        color: #48d7bb;
        font-size: 190px;
      }

      .shine {
        position: absolute;
        left: 205px;
        top: 327px;
        width: 170px;
        height: 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        transform: rotate(-11deg);
      }

      .shine.two {
        left: 792px;
        top: 424px;
        width: 210px;
      }
    </style>
  </head>
  <body>
    <main class="logo">
      <section class="stack" aria-label="+1 Woordenschat Bezem Escape">
        <span class="spark one"></span>
        <span class="spark two"></span>
        <span class="line plus" data-text="+1">+1</span>
        <span class="line word" data-text="Woordenschat">Woordenschat</span>
        <span class="line broom" data-text="Bezem">Bezem</span>
        <span class="line escape" data-text="Escape">Escape</span>
        <span class="shine"></span>
        <span class="shine two"></span>
      </section>
    </main>
  </body>
</html>
